site_name: Presentación proyecto - Randy Vasquez
site_description: Documentación y presentación del proyecto que estoy y estaré creando a lo largo del curso en mi segundo año de DAM.
site_author: Randy Vasquez Ledezma

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  
nav:
  - Inicio: index.md
  - Sobre el Proyecto: para-quien-es.md
  - Características: caracteristicas.md
  - Contacto: contacto.md
