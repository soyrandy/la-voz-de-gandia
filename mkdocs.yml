site_name: La Voz de Gandia
site_description: Documentación y presentación del proyecto que estoy y estaré creando a lo largo del curso en mi segundo año de DAM.
site_author: Randy Vasquez Ledezma

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Modo Oscuro
    - scheme: slate
      primary: purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Modo Claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.right
    - navigation.tracking
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  
nav:
  - Inicio: index.md
  - ¿Para quién es?: para-quien-es.md
  - Características: caracteristicas.md
  - Contacto: contacto.md
